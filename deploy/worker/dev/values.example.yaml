# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

# Dev 环境 Worker 配置

# ========== 基础 ==========
NAMESPACE: "cohub-dev"
APP_NAME: "cohub-worker-dev"
USER_APP_NAME: "cohub-user-worker-dev"
SYSTEM_APP_NAME: "cohub-system-worker-dev"

# ========== 镜像 ==========
IMAGE_REPOSITORY: "ghcr.io/example/cohub-worker"
IMAGE_TAG: "main-93aeadc"
IMAGE_PULL_POLICY: "Always"
IMAGE_PULL_SECRET: "registry-pull-secret"

# ========== 副本与资源 ==========
USER_REPLICAS: "1"
USER_REQUEST_CPU: "100m"
USER_REQUEST_MEMORY: "128Mi"
USER_LIMIT_CPU: "500m"
USER_LIMIT_MEMORY: "512Mi"

SYSTEM_REPLICAS: "1"
SYSTEM_REQUEST_CPU: "100m"
SYSTEM_REQUEST_MEMORY: "128Mi"
SYSTEM_LIMIT_CPU: "500m"
SYSTEM_LIMIT_MEMORY: "512Mi"
SYSTEM_WORKER_CONCURRENCY: "4"
SANDBOX_IDLE_REAPER_LIMIT: "50"
# ========== Worker 配置 ==========
INTERNAL_API_BASE_URL: "http://cohub-api-dev:8787"
GITEA_BASE_URL: "https://gitea.example.com"
GITEA_ORG: "cohub-checkpoints-dev"
# Optional. Leave empty to use the Generation SDK default.
GENERATION_BASE_URL: ""
SPACE_STORAGE_ROOT: "/space-storage"
SPACE_SYSTEM_ROOT: "/system-storage"
CHECKPOINT_CACHE_ROOT: "/checkpoint-cache"
SPACE_STORAGE_PVC: "cohub-spaces-pvc"
SPACE_SYSTEM_PVC: "cohub-system-pvc"
CHECKPOINT_CACHE_PVC: "cohub-checkpoints-pvc"
SPACE_STORAGE_SUBPATH: "workspaces/dev"
SPACE_SYSTEM_SUBPATH: "dev"
CHECKPOINT_CACHE_SUBPATH: "workspaces/dev/checkpoints"
PLATFORM_CONFIG_ROOT: "/configs"
PLATFORM_SPACE_ID: "f371b93a-4710-4d48-81d2-cde277cbcf89"
CONFIGS_SUBPATH: "configs/dev"
# checkpoint git 提交作者邮箱（不配默认 noreply@cohub.live）
CHECKPOINT_GIT_AUTHOR_EMAIL: "noreply@cohub.live"
ENV: "dev"
LOG_LEVEL: "debug"

# ========== OSS 配置 ==========
TURN_OBJECT_S3_ENDPOINT: "https://s3.example.com"
TURN_OBJECT_S3_REGION: "us-east-1"
TURN_OBJECT_S3_BUCKET: "cohub-sessions"
TURN_OBJECT_CDN_BASE_URL: "https://sessions.cohub.live"
PUBLIC_ASSET_OSS_ENDPOINT: "https://s3.example.com"
PUBLIC_ASSET_OSS_REGION: "us-east-1"
PUBLIC_ASSET_OSS_BUCKET: "cohub-public"
# 用户上传（聊天附件 / App source）存储，与 API 使用同一套配置
USER_UPLOAD_S3_ENDPOINT: "https://s3.example.com"
USER_UPLOAD_S3_REGION: "auto"
CHAT_ATTACHMENT_S3_BUCKET: "cohub-chat-attachments"
CHECKPOINT_ASSET_OSS_ENDPOINT: "https://s3.example.com"
CHECKPOINT_ASSET_OSS_REGION: "us-east-1"
CHECKPOINT_ASSET_OSS_BUCKET: "cohub-checkpoint-assets"
MAX_UNAVAILABLE: "0"
MAX_SURGE: "1"
TERMINATION_GRACE_PERIOD_SECONDS: "360"
TASK_WORKER_SHUTDOWN_TIMEOUT_MS: "300000"
SYSTEM_WORKER_SHUTDOWN_TIMEOUT_MS: "300000"
