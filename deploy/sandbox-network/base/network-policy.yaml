apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: cohub-sessions
spec:
  podSelector:
    matchLabels:
      app: agent-sandbox
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cohub
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [cohub-api, cohub-worker, cohub-user-worker, cohub-system-worker, cohub-gateway]
      ports:
        - {protocol: TCP, port: 8788}
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 5173}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 5173}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cohub
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cohub-api
      ports:
        - {protocol: TCP, port: 8787}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
              - 168.63.129.16/32
