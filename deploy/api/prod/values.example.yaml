# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

# 请填写后再部署
# 如需重新生成可参考 values.template.yaml

# ========== 基础 ==========
NAMESPACE: "cohub"
APP_NAME: "cohub-api"

# ========== 镜像 ==========
IMAGE_REPOSITORY: "ghcr.io/example/cohub-api"
IMAGE_TAG: "v1.43.0"
IMAGE_PULL_POLICY: "IfNotPresent"
IMAGE_PULL_SECRET: "registry-pull-secret"

# ========== 服务端口 ==========
SERVICE_PORT: "8787"
CONTAINER_PORT: "8787"

# ========== 副本与资源 ==========
REPLICAS: "4"
REQUEST_CPU: "500m"
REQUEST_MEMORY: "256Mi"
LIMIT_CPU: "2"
LIMIT_MEMORY: "1Gi"

# ========== 健康检查 ==========
LIVENESS_PATH: "/healthz"
LIVENESS_INITIAL_DELAY: "20"
LIVENESS_PERIOD: "10"
LIVENESS_TIMEOUT: "2"
LIVENESS_FAILURE_THRESHOLD: "3"
READINESS_PATH: "/readyz"
READINESS_INITIAL_DELAY: "5"
READINESS_PERIOD: "5"
READINESS_TIMEOUT: "2"
READINESS_FAILURE_THRESHOLD: "3"

# ========== API 配置 ==========
LOGTO_ENDPOINT: "https://auth.example.com"
LOGTO_MANAGEMENT_API_RESOURCE: "https://default.logto.app/api"
GITEA_BASE_URL: "https://gitea.example.com"
GITEA_MANAGED_EMAIL_DOMAIN: "example.com"
WEB_ORIGIN: "https://app.example.com"
# Optional: URL of a router-status service for model health and availability data.
ROUTER_STATUS_URL: ""
SANDBOX_IMAGE: "git.talesofai.com/talesofai/cohub-sandbox:v1.33.0"
SANDBOX_SEARCH_ENABLED: "true"
SANDBOX_SEARCH_VERSION: "latest"
SANDBOX_SEARCH_CDN_BASE_URL: "https://public.cohub.live/search"
SPACE_STORAGE_ROOT: "/space-storage"
SPACE_SYSTEM_ROOT: "/system-storage"
SPACE_STORAGE_PVC: "cohub-spaces-pvc"
SPACE_SYSTEM_PVC: "cohub-system-pvc"
CHECKPOINT_CACHE_PVC: "cohub-checkpoints-pvc"
SPACE_STORAGE_SUBPATH: "workspaces/prod"
SPACE_SYSTEM_SUBPATH: "prod"
CHECKPOINT_CACHE_SUBPATH: "workspaces/prod/checkpoints"
PLATFORM_CONFIG_ROOT: "/configs"
TURN_OBJECT_S3_ENDPOINT: "https://s3.example.com"
TURN_OBJECT_S3_REGION: "us-east-1"
TURN_OBJECT_S3_BUCKET: "cohub-sessions"
TURN_OBJECT_CDN_BASE_URL: "https://sessions.example.com"
PUBLIC_ASSET_OSS_ENDPOINT: "https://s3.example.com"
PUBLIC_ASSET_OSS_PUBLIC_ENDPOINT: "https://s3.example.com"
PUBLIC_ASSET_OSS_REGION: "us-east-1"
PUBLIC_ASSET_OSS_BUCKET: "cohub-public"
PUBLIC_ASSET_CDN_BASE_URL: "https://public.example.com"
USER_UPLOAD_S3_ENDPOINT: "https://account-id.r2.cloudflarestorage.com"
USER_UPLOAD_S3_REGION: "auto"
CHAT_ATTACHMENT_S3_BUCKET: "cohub-chat-attachments"
CHAT_ATTACHMENT_PUBLIC_BASE_URL: "https://uploads.example.com"
SPACE_UPLOAD_S3_BUCKET: "cohub-space-uploads"
APP_ASSET_CDN_BASE_URL: "https://works.example.com"
CONFIGS_SUBPATH: "configs/prod"
# 沙箱公网端口域名列表（逗号分隔，第一个为主域名；不配默认 cohub.live,cohub.run）
SANDBOX_PUBLIC_DOMAINS: "cohub.live,cohub.run"
# Work 内容端口 URL 允许的域名后缀（安全边界，不配默认 .cohub.live,.cohub.run）
APP_CONTENT_HOST_SUFFIXES: ".cohub.live,.cohub.run"
# App 独立域名模板，{id} 为 App ID（不配则不提供独立域名）
APP_STANDALONE_HOST_TEMPLATE: "{id}.apps.example.com"
# checkpoint git 提交作者邮箱（不配默认 noreply@cohub.live）
CHECKPOINT_GIT_AUTHOR_EMAIL: "noreply@cohub.live"

# ========== 路由配置 ==========
ROUTE_ENABLED: "true"
API_HOSTNAMES: "api.cohub.live,api.cohub.run"

# ========== 环境标识 ==========
ENV: "prod"
LOG_LEVEL: "info"
MAX_UNAVAILABLE: "0"
MAX_SURGE: "1"
TERMINATION_GRACE_PERIOD_SECONDS: "120"
