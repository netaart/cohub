# Workspace API 敏感配置模板
# 注意：请勿提交真实 secrets.yaml 到仓库

apiVersion: v1
kind: Secret
metadata:
  name: cohub-api-secrets
  namespace: cohub
stringData:
  # 数据库连接地址
  DATABASE_URL: "postgres://user:pass@host:5432/cohub"
  # Redis 连接地址（业务 Redis，API/Agent/Worker 共用，用于 models cache、space events 等）
  REDIS_URL: "redis://redis-service:6379"
  # BullMQ 队列 Redis 连接地址（Worker 消费任务队列使用；可与 REDIS_URL 不同）
  BULLMQ_REDIS_URL: "redis://redis-bullmq-service:6379"
  # LiteLLM API key (用于 Agent 调用 LLM)
  LITELLM_API_KEY: "sk-xxx"
  # Required by the Worker for Generation SDK requests. This is not a Space secret.
  GENERATION_API_KEY: "sk-xxx"
  # 可选：Talesofai Billing API 地址（留空禁用 billing；prod 示例：https://billing.example.com/v1）
  TALESOFAI_BILLING_BASE_URL: ""
  # 可选：Talesofai Billing business key（留空禁用 billing）
  TALESOFAI_BILLING_BUSINESS_KEY: ""
  # 可选：Talesofai Billing Admin API key（留空禁用 billing）
  TALESOFAI_BILLING_ADMIN_API_KEY: ""
  # Optional: deployment-level Meta provider for Work promotions
  COHUB_META_PIXEL_ID: ""
  COHUB_META_CAPI_ACCESS_TOKEN: ""
  COHUB_META_API_VERSION: "v21.0"
  # Trusted proxy header set by the edge, for example cf-connecting-ip
  COHUB_META_CLIENT_IP_HEADER: ""
  # Optional Meta Events Manager test code; remove after testing
  COHUB_META_TEST_EVENT_CODE: ""
  # 必填：应用级密钥（用于加密存储凭据、签名会话与执行授权 token）
  APP_ENCRYPTION_KEY: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  # 必填：Worker 通信密钥（与 Worker 保持一致）
  WORKER_SECRET: "CHANGE_ME"
  # 必填：Turn 中间消息 OSS 写入 AccessKey
  TURN_OBJECT_S3_ACCESS_KEY_ID: "CHANGE_ME"
  TURN_OBJECT_S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  # 必填：公开资产 OSS 写入 AccessKey（用于头像和旧客户端附件上传）
  PUBLIC_ASSET_OSS_ACCESS_KEY_ID: "CHANGE_ME"
  PUBLIC_ASSET_OSS_SECRET_ACCESS_KEY: "CHANGE_ME"
  # Required: R2 credentials shared by chat attachment and Space upload buckets
  USER_UPLOAD_S3_ACCESS_KEY_ID: "CHANGE_ME"
  USER_UPLOAD_S3_SECRET_ACCESS_KEY: "CHANGE_ME"
  # 必填：Logto M2M 应用凭证（用于 Management API 读写用户资料）
  LOGTO_M2M_APP_ID: "CHANGE_ME"
  LOGTO_M2M_APP_SECRET: "CHANGE_ME"
