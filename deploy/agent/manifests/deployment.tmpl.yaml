apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{APP_NAME}}
  namespace: {{NAMESPACE}}
spec:
  replicas: {{REPLICAS}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{MAX_UNAVAILABLE}}
      maxSurge: {{MAX_SURGE}}
  selector:
    matchLabels:
      app: {{APP_NAME}}
  template:
    metadata:
      labels:
        app: {{APP_NAME}}
        cohub.live/sandbox-control-client: "true"
    spec:
      terminationGracePeriodSeconds: {{TERMINATION_GRACE_PERIOD_SECONDS}}
      imagePullSecrets:
        - name: gitea-registry
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: agent
          image: {{IMAGE}}
          imagePullPolicy: {{IMAGE_PULL_POLICY}}
          ports:
            - containerPort: {{PORT}}
          envFrom:
            - configMapRef:
                name: {{APP_NAME}}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: REDIS_URL
            - name: BULLMQ_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: BULLMQ_REDIS_URL
            - name: WORKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: WORKER_SECRET
            - name: TURN_OBJECT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: TURN_OBJECT_S3_ACCESS_KEY_ID
            - name: TURN_OBJECT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{APP_NAME}}-secrets
                  key: TURN_OBJECT_S3_SECRET_ACCESS_KEY
          {{RESOURCES}}
          volumeMounts:
            - name: space-storage
              mountPath: /space-storage
              subPath: {{WORKSPACE_SUBPATH}}
            - name: space-storage
              mountPath: {{SESSIONS_DIR}}
              subPath: {{SESSIONS_SUBPATH}}
            - name: space-storage
              mountPath: /configs
              subPath: {{CONFIGS_SUBPATH}}
            - name: checkpoint-cache
              mountPath: {{CHECKPOINT_CACHE_ROOT}}
              subPath: {{CHECKPOINT_CACHE_SUBPATH}}
              readOnly: true
      volumes:
        - name: space-storage
          persistentVolumeClaim:
            claimName: {{SPACE_STORAGE_PVC}}
        - name: checkpoint-cache
          persistentVolumeClaim:
            claimName: {{CHECKPOINT_CACHE_PVC}}
