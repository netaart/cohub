# Example deploy values. Copy to values.yaml and fill in your environment.
# Real environment values are not committed (see .gitignore).

appName: cohub-agent-dev
namespace: cohub-dev
serviceName: cohub-agent-dev
port: 8788
image: ghcr.io/example/cohub-agent:main-17f713a
replicas: "1"
maxUnavailable: "0"
maxSurge: "1"
terminationGracePeriodSeconds: "86400"
imagePullPolicy: Always
env: dev
logLevel: debug
workerSecret: ""
workspaceRoot: /space-storage
checkpointCacheRoot: /checkpoint-cache
sessionsDir: /sessions
platformConfigRoot: /configs
spaceStoragePvc: cohub-spaces-pvc
checkpointCachePvc: cohub-checkpoints-pvc
workspaceSubpath: workspaces/dev
checkpointCacheSubpath: workspaces/dev/checkpoints
sessionsSubpath: sessions/dev
configsSubpath: configs/dev
sessionsNamespace: cohub-sessions-dev
agentWorkerConcurrency: "8"
agentShutdownDrainTimeoutMs: "86400000"
resourceRequestCpu: "0.1"
resourceRequestMemory: "256Mi"
resourceLimitCpu: "1"
resourceLimitMemory: "1024Mi"
TURN_OBJECT_S3_ENDPOINT: "https://s3.example.com"
TURN_OBJECT_S3_REGION: "us-east-1"
TURN_OBJECT_S3_BUCKET: "cohub-sessions"
TURN_OBJECT_S3_TIMEOUT_MS: "5000"
TURN_OBJECT_S3_MAX_ATTEMPTS: "3"
TURN_OBJECT_CDN_BASE_URL: "https://sessions.example.com"
