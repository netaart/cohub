# Agent Dev 环境敏感配置
# 注意：请勿提交真实 secrets 到仓库
# 请复制为 secrets.yaml 并填入真实值

apiVersion: v1
kind: Secret
metadata:
  name: cohub-agent-dev-secrets
  namespace: cohub-dev
type: Opaque
stringData:
  # 数据库连接地址（Agent 需要直接认领/合并 session_turns）
  DATABASE_URL: "postgres://user:pass@host:5432/cohub"
  # Redis 连接地址（业务 Redis，API/Agent/Worker 共用，用于 realtime、abort、session lock 等）
  REDIS_URL: "redis://redis-service:6379"
  # BullMQ 队列 Redis 连接地址（必须与 API 的 BULLMQ_REDIS_URL 一致）
  BULLMQ_REDIS_URL: "redis://redis-bullmq-service:6379"
  # 必填：应用级加密密钥；Agent 用于生成 COHUB_EXECUTION_TOKEN（与 API、Worker 保持一致）
  APP_ENCRYPTION_KEY: "replace-me"
  # 必填：Worker 通信密钥（与 API、Worker 保持一致）
  WORKER_SECRET: "replace-me"
  # 必填：Turn 中间消息 OSS 写入 AccessKey
  TURN_OBJECT_S3_ACCESS_KEY_ID: "CHANGE_ME"
  TURN_OBJECT_S3_SECRET_ACCESS_KEY: "CHANGE_ME"
