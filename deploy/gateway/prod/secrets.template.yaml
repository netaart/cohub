# Prod 环境敏感配置
# 注意：请勿提交真实 secrets 到仓库
# 复制此文件为 secrets.yaml 并填入真实值

apiVersion: v1
kind: Secret
metadata:
  name: cohub-gateway-secrets
  namespace: cohub
stringData:
  # 业务 Redis 连接地址（realtime、runtime registration、space hook dedup 等）
  REDIS_URL: "redis://..."
  # BullMQ 队列 Redis 连接地址（必须与 Agent、API、Worker 保持一致）
  BULLMQ_REDIS_URL: "redis://..."
  # Must match cohub-api-secrets.WORKER_SECRET
  WORKER_SECRET: "..."
