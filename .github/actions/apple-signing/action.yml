name: Apple signing
description: Import App Store certificates and provisioning profiles into an isolated keychain
inputs:
  team-id:
    required: true
    description: Apple team identifier
  certificate:
    required: true
    description: Base64 application signing P12
  installer-certificate:
    required: false
    description: Base64 Mac installer signing P12
  password:
    required: true
    description: P12 password
  profile:
    required: true
    description: Base64 application provisioning profile
  share-profile:
    required: false
    description: Base64 iOS share extension provisioning profile
outputs:
  profile:
    description: Application provisioning profile UUID
    value: ${{ steps.import.outputs.profile }}
  share-profile:
    description: Share extension provisioning profile UUID
    value: ${{ steps.import.outputs.share-profile }}
  profile-path:
    description: Application provisioning profile path
    value: ${{ steps.import.outputs.profile-path }}
  identity:
    description: Application signing certificate SHA1
    value: ${{ steps.import.outputs.identity }}
  installer-identity:
    description: Installer signing certificate SHA1
    value: ${{ steps.import.outputs.installer-identity }}
runs:
  using: composite
  steps:
    - id: import
      shell: bash
      env:
        APPLE_TEAM_ID: ${{ inputs.team-id }}
        APPLE_CERTIFICATE: ${{ inputs.certificate }}
        APPLE_INSTALLER_CERTIFICATE: ${{ inputs.installer-certificate }}
        APPLE_CERTIFICATE_PASSWORD: ${{ inputs.password }}
        APPLE_PROFILE: ${{ inputs.profile }}
        APPLE_SHARE_PROFILE: ${{ inputs.share-profile }}
      run: python3 scripts/apple/import-signing.py
