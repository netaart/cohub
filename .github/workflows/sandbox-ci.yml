name: Sandbox CI

on:
  pull_request:
    # Only sandbox and CLI changes need the Go and Windows runners. The
    # package.json/CHANGELOG exclusions mirror ci.yml's Version Packages skip.
    paths:
      - 'apps/sandbox/**'
      - 'packages/cli/**'
      - 'packages/sdk/**'
      - 'packages/protocol/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/sandbox-ci.yml'
      - '!**/package.json'
      - '!**/CHANGELOG.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-checks:
    name: Format, vet, test (sandbox)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum

      - name: Check formatting
        working-directory: apps/sandbox
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: apps/sandbox
        run: go vet ./...

      - name: Test
        working-directory: apps/sandbox
        run: go test ./...

      - name: Test search startup with race detector
        working-directory: apps/sandbox
        run: go test -race ./search

  windows-checks:
    name: Windows runtime (sandbox, CLI)
    runs-on: windows-latest
    env:
      GITEA_NPM_TOKEN: ${{ secrets.GITEA_NPM_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum

      - name: Vet and build sandbox
        working-directory: apps/sandbox
        run: |
          go vet ./...
          go build ./...

      # Windows-specific process, path fence, file mutation, watcher and display tests; Git Bash ships with the runner.
      - name: Test sandbox Windows behavior
        working-directory: apps/sandbox
        run: go test -run 'Windows|FSMutation' ./process ./rpc ./filewatch ./display

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Configure Talesofai npm auth
        run: |
          if [ -n "$GITEA_NPM_TOKEN" ]; then
            printf '\n//git.talesofai.com/api/packages/talesofai/npm/:_authToken=%s\n' "$GITEA_NPM_TOKEN" >> ~/.npmrc
          fi

      # Fork PRs get no secrets, and lockfile policy verification would 401 on
      # the private optional billing SDK. Nothing here builds billing, so skip it.
      - name: Install dependencies
        run: |
          if [ -n "$GITEA_NPM_TOKEN" ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --frozen-lockfile --trust-lockfile
          fi

      - name: Build CLI dependencies
        run: pnpm --filter "@neta-art/cohub-cli^..." build

      - name: Test CLI Windows behavior
        working-directory: packages/cli
        run: node --import tsx --test tests/runtime-windows.test.ts tests/native-paths.test.ts tests/native-ingest.test.ts
