name: Sandbox Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/sandbox/**'
      - 'scripts/prewarm-sandbox.py'
      - '.github/workflows/sandbox-docker-build-push.yml'
  workflow_dispatch:
    inputs:
      deploy-prod:
        description: 'Also deploy the rebuilt sandbox image to prod'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-sandbox

jobs:
  build-and-push:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      sandbox_release_changed: ${{ steps.release-scope.outputs.changed }}
      sandbox_sha_tag: ${{ steps.sha-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate service tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production service tag: $TAG"
            echo "Expected a stable semver tag like v1.23.0."
            exit 1
          fi

      - name: Detect sandbox release changes
        id: release-scope
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          git fetch --tags --force --prune

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous service tag found; proceeding with sandbox publish."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG" "$TAG" -- apps/sandbox scripts/prewarm-sandbox.py .github/workflows/sandbox-docker-build-push.yml || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No sandbox-related changes detected between $PREV_TAG and $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Sandbox-related changes detected between $PREV_TAG and $TAG:"
          echo "$CHANGED_FILES"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum

      - name: Go fmt check
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          cd apps/sandbox
          test -z "$(gofmt -l .)"

      - name: Go vet
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          cd apps/sandbox
          go vet ./...

      - name: Go test
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          cd apps/sandbox
          go test ./...

      - name: Set up Docker Buildx
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-game
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve sandbox sha tag
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: sha-tag
        # Match metadata-action's fixed 7-character SHA prefix.
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Compute cohub-cli refresh token
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: cli-refresh
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "token=$(date +%s)" >> "$GITHUB_OUTPUT"
          else
            echo "token=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tags
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: image-tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          GAME_SUFFIX: "/${{ env.IMAGE_NAME }}-game:"
        run: |
          runtime=(); game=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            if [[ "$tag" == *"$GAME_SUFFIX"* ]]; then
              game+=("$tag")
            else
              runtime+=("$tag")
            fi
          done <<< "$TAGS"
          [[ ${#runtime[@]} -gt 0 && ${#game[@]} -gt 0 ]] || {
            echo "docker/metadata-action produced no tags for one of the images" >&2
            exit 1
          }
          join() { local IFS=,; printf '%s' "$*"; }
          echo "runtime=$(join "${runtime[@]}")" >> "$GITHUB_OUTPUT"
          echo "game=$(join "${game[@]}")" >> "$GITHUB_OUTPUT"

      - name: Build images
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/bake-action@v7
        env:
          RUNTIME_TAGS: ${{ steps.image-tags.outputs.runtime }}
          GAME_TAGS: ${{ steps.image-tags.outputs.game }}
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          COHUB_CLI_REFRESH: ${{ steps.cli-refresh.outputs.token }}
          GIT_REVISION: ${{ github.sha }}
          GIT_VERSION: ${{ github.ref_name }}
        with:
          source: .
          files: |
            apps/sandbox/docker-bake.hcl
            apps/sandbox/docker-bake.ci.hcl
          load: true

      - name: Verify sandbox and graphics
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          for profile in runtime game; do
            image="${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
            [[ "$profile" == game ]] && image="${image}-game"
            docker run --rm --entrypoint bash --shm-size=256m \
              -v "$PWD/apps/sandbox/scripts:/smoke:ro" \
              "$image:${{ steps.sha-tag.outputs.tag }}" \
              /smoke/smoke-image.sh "$profile"
          done

      - name: Push images
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          docker push --all-tags "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          docker push --all-tags "${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}-game"

  deploy-dev:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Get short sha
        id: get-sha
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Patch sandbox image config
        run: |
          kubectl patch configmap cohub-api-dev-config -n cohub-dev --type=merge \
            -p='{"data":{"SANDBOX_IMAGE":"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-sandbox:sha-${{ steps.get-sha.outputs.sha }}","SANDBOX_GAME_IMAGE":"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-sandbox-game:sha-${{ steps.get-sha.outputs.sha }}"}}'

      - name: Restart API to pick up new config
        run: |
          kubectl rollout restart deployment/cohub-api-dev -n cohub-dev
          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s

  deploy-prod:
    needs: build-and-push
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.sandbox_release_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-prod == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Resolve sandbox image tag
        id: get-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ needs.build-and-push.outputs.sandbox_sha_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^(sha-[0-9a-f]{4,}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid sandbox image tag: '$TAG'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Prewarm sandbox images
        continue-on-error: true
        run: |
          python3 scripts/prewarm-sandbox.py --env prod \
            --image '${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-sandbox:${{ steps.get-tag.outputs.tag }}' \
            --image '${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-sandbox-game:${{ steps.get-tag.outputs.tag }}'

      - name: Patch sandbox image config
        run: |
          kubectl patch configmap cohub-api-config -n cohub --type=merge \
            -p='{"data":{"SANDBOX_IMAGE":"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-sandbox:${{ steps.get-tag.outputs.tag }}","SANDBOX_GAME_IMAGE":"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/cohub-sandbox-game:${{ steps.get-tag.outputs.tag }}"}}'

      - name: Restart API to pick up new config
        run: |
          kubectl rollout restart deployment/cohub-api -n cohub
          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s
