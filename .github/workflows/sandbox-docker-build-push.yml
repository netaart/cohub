name: Sandbox Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/sandbox/**'
  workflow_dispatch:
    inputs:
      deploy-prod:
        description: 'Also deploy the rebuilt sandbox image to prod'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-sandbox

jobs:
  build-and-push:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    outputs:
      sandbox_release_changed: ${{ steps.release-scope.outputs.changed }}
      sandbox_sha_tag: ${{ steps.sha-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate service tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production service tag: $TAG"
            echo "Expected a stable semver tag like v1.23.0."
            exit 1
          fi

      - name: Detect sandbox release changes
        id: release-scope
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          git fetch --tags --force --prune

          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous service tag found; proceeding with sandbox publish."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_TAG" "$TAG" -- apps/sandbox || true)

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No sandbox-related changes detected between $PREV_TAG and $TAG."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Sandbox-related changes detected between $PREV_TAG and $TAG:"
          echo "$CHANGED_FILES"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/sandbox/go.mod
          cache-dependency-path: apps/sandbox/go.sum

      - name: Go fmt check
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          cd apps/sandbox
          test -z "$(gofmt -l .)"

      - name: Go vet
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          cd apps/sandbox
          go vet ./...

      - name: Go test
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        run: |
          cd apps/sandbox
          go test ./...

      - name: Set up Docker Buildx
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolve sandbox sha tag
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: sha-tag
        # Mirror docker/metadata-action's type=sha,format=short: a fixed 7-char
        # prefix of the full sha. git rev-parse --short is NOT equivalent (it
        # extends past 7 chars when the prefix is ambiguous).
        run: echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Compute cohub-cli refresh token
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        id: cli-refresh
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "token=$(date +%s)" >> "$GITHUB_OUTPUT"
          else
            echo "token=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: ${{ steps.release-scope.outputs.changed == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./apps/sandbox
          file: ./apps/sandbox/Dockerfile
          cache-from: type=gha,scope=sandbox-build
          cache-to: type=gha,mode=min,scope=sandbox-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            COHUB_CLI_REFRESH=${{ steps.cli-refresh.outputs.token }}

  deploy-dev:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Get short sha
        id: get-sha
        run: |
          echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Patch sandbox image config
        run: |
          kubectl patch configmap cohub-api-dev-config -n cohub-dev --type=json \
            -p="[{\"op\":\"replace\",\"path\":\"/data/SANDBOX_IMAGE\",\"value\":\"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${{ steps.get-sha.outputs.sha }}\"}]"

      - name: Restart API to pick up new config
        run: |
          kubectl rollout restart deployment/cohub-api-dev -n cohub-dev
          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s

  deploy-prod:
    needs: build-and-push
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && needs.build-and-push.outputs.sandbox_release_changed == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy-prod == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Resolve sandbox image tag
        id: get-tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ needs.build-and-push.outputs.sandbox_sha_tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^(sha-[0-9a-f]{4,}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid sandbox image tag: '$TAG'" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Patch sandbox image config
        run: |
          kubectl patch configmap cohub-api-config -n cohub --type=json \
            -p="[{\"op\":\"replace\",\"path\":\"/data/SANDBOX_IMAGE\",\"value\":\"${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.get-tag.outputs.tag }}\"}]"

      - name: Restart API to pick up new config
        run: |
          kubectl rollout restart deployment/cohub-api -n cohub
          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s
