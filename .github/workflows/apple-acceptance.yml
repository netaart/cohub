name: Apple Acceptance

on:
  workflow_dispatch:
  push:
    branches: [codex/apple-store-validation]
    paths:
      - 'apps/apple-tests/**'
      - 'apps/ios/acceptance.yml'
      - 'apps/desktop/macos/acceptance.yml'
      - '.github/workflows/apple-acceptance.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: apple-acceptance
  cancel-in-progress: false

jobs:
  screenshots:
    name: ${{ matrix.device }} acceptance
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        device: [mac, iphone, ipad]
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - name: Extract signed Mac client
        if: matrix.device == 'mac'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44247841138 --repo "$GITHUB_REPOSITORY" --name cohub-macos-app-store --dir "$RUNNER_TEMP/signed-mac"
          pkgutil --check-signature "$RUNNER_TEMP/signed-mac/Cohub-1.0.0.pkg"
          pkgutil --expand-full "$RUNNER_TEMP/signed-mac/Cohub-1.0.0.pkg" "$RUNNER_TEMP/mac-package"
          python3 - <<'PY'
          import os, pathlib, subprocess
          app = next(pathlib.Path(os.environ['RUNNER_TEMP'],'mac-package').rglob('Cohub.app'))
          subprocess.run(['codesign','--verify','--deep','--strict',str(app)],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('COHUB_MAC_APP_PATH='+str(app)+'\n')
          PY
          xcodegen generate --spec apps/desktop/macos/acceptance.yml
      - name: Prepare simulator
        if: matrix.device != 'mac'
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          xcodegen generate --spec apps/ios/acceptance.yml
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))['devices']
          prefix = 'iPhone' if os.environ['DEVICE'] == 'iphone' else 'iPad'
          candidates = [d for runtime, rows in devices.items() if 'iOS' in runtime for d in rows if d['name'].startswith(prefix)]
          candidates.sort(key=lambda d: ('Pro Max' in d['name'] if prefix == 'iPhone' else '13-inch' in d['name'], d['name']), reverse=True)
          chosen = candidates[0]
          subprocess.run(['xcrun','simctl','boot',chosen['udid']],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',chosen['udid'],'-b'],check=True)
          subprocess.run(['xcrun','simctl','status_bar',chosen['udid'],'override','--time','9:41','--batteryState','charged','--batteryLevel','100'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIMULATOR_ID='+chosen['udid']+'\n')
          print('Simulator:',chosen['name'])
          PY
          open -a Simulator
      - name: Configure private test environment
        env:
          EMAIL: ${{ secrets.APPLE_REVIEW_EMAIL }}
          MAILBOX: ${{ secrets.APPLE_REVIEW_MAILBOX_URL }}
          SAMPLE_SPACE: ${{ vars.APPLE_SCREENSHOT_SPACE_ID }}
          DEVICE: ${{ matrix.device }}
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          project = 'apps/desktop/macos/CohubAcceptance.xcodeproj' if os.environ['DEVICE']=='mac' else 'apps/ios/Cohub.xcodeproj'
          scheme = pathlib.Path(project)/'xcshareddata/xcschemes/Cohub Acceptance.xcscheme'
          tree = ET.parse(scheme); action = tree.getroot().find('TestAction')
          action.set('shouldUseLaunchSchemeArgsEnv','NO')
          variables = ET.SubElement(action,'EnvironmentVariables')
          values = {'COHUB_REVIEW_EMAIL':os.environ['EMAIL'],'COHUB_REVIEW_MAILBOX_URL':os.environ['MAILBOX'],'COHUB_SCREENSHOT_SPACE':os.environ['SAMPLE_SPACE'],'COHUB_MAC_APP_PATH':os.environ.get('COHUB_MAC_APP_PATH','')}
          for key,value in values.items(): ET.SubElement(variables,'EnvironmentVariable',key=key,value=value,isEnabled='YES')
          tree.write(scheme,encoding='UTF-8',xml_declaration=True)
          PY
      - name: Exercise native login and capture screens
        timeout-minutes: 12
        uses: apple-actions/xcodebuild@v1.3.0
        env:
          NSUnbufferedIO: 'YES'
        with:
          project: ${{ matrix.device == 'mac' && 'apps/desktop/macos/CohubAcceptance.xcodeproj' || 'apps/ios/Cohub.xcodeproj' }}
          scheme: Cohub Acceptance
          configuration: ${{ matrix.device == 'mac' && 'Debug' || 'Release' }}
          destination: ${{ matrix.device == 'mac' && 'platform=macOS' || format('platform=iOS Simulator,id={0}', env.SIMULATOR_ID) }}
          action: test
          extra-arguments: -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240
          output-formatter: ''
          result-bundle-path: ${{ runner.temp }}/Acceptance.xcresult
          build-settings: |
            CODE_SIGNING_ALLOWED=NO
            ONLY_ACTIVE_ARCH=YES
            MARKETING_VERSION=1.0.0
            CURRENT_PROJECT_VERSION=6.1
      - name: Export selected screenshots
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/Acceptance.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Acceptance.xcresult" --output-path "$RUNNER_TEMP/attachments"
            python3 - <<'PY'
          import json, os, pathlib, shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          output=root/'screenshots';output.mkdir(exist_ok=True)
          for manifest in (root/'attachments').rglob('manifest.json'):
            def visit(value):
              if isinstance(value,dict):
                name=value.get('suggestedHumanReadableName',''); file=value.get('exportedFileName','')
                if name.startswith('STORE_') and file:
                  source=manifest.parent/file
                  if source.is_file():shutil.copyfile(source,output/(name if name.endswith('.png') else name+'.png'))
                for item in value.values():visit(item)
              elif isinstance(value,list):
                for item in value:visit(item)
            visit(json.loads(manifest.read_text()))
          print('Exported store screenshots:',len(list(output.glob('*.png'))))
          PY
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cohub-${{ matrix.device }}-screenshots
          path: ${{ runner.temp }}/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
