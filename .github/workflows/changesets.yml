name: Changesets

on:
  push:
    branches:
      - main
    # 只在真正需要版本处理时触发：有 changeset、或版本号/锁文件变更。
    # 避免每次 push main 都全量 install 并 force-push changeset-release/main 分支
    #（那会反复同步 Version Packages PR，触发该 PR 上一堆无意义的 CI/Preview Deploy run）
    paths:
      - '.changeset/**'
      - '**/package.json'
      - 'pnpm-lock.yaml'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  version-and-release:
    runs-on: ubuntu-latest
    env:
      GITEA_NPM_TOKEN: ${{ secrets.GITEA_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configure Talesofai npm auth
        run: |
          if [ -z "$GITEA_NPM_TOKEN" ]; then
            echo "GITEA_NPM_TOKEN not set; installing without private billing packages"
          fi
          if [ -n "$GITEA_NPM_TOKEN" ]; then
            printf '\n//git.talesofai.com/api/packages/talesofai/npm/:_authToken=%s\n' "$GITEA_NPM_TOKEN" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        # 注意：Version Packages PR 合并回 main 时（只改 package.json/CHANGELOG/.changeset）
        # 需要靠上面的 paths 命中才会跑到这里执行 publish，路径过滤不能改窄
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: update versions"
          title: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: 0

      - name: Push package tags
        # @changesets/cli v3 prints "Created git tags." instead of "New tag:", so
        # changesets/action@v1 never parses them and leaves the tags unpushed.
        # Push the tags the publish step created locally.
        run: git push origin --tags
