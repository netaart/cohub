name: Worker Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/worker/**'
      - 'deploy/worker/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for deploy'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

env:
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-worker

jobs:
  build-and-push:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GITEA_NPM_TOKEN: ${{ secrets.GITEA_NPM_TOKEN }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate service tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production service tag: $TAG"
            echo "Expected a stable semver tag like v1.23.0."
            exit 1
          fi

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          install: false

      - name: Configure Talesofai npm auth
        run: |
          if [ -z "$GITEA_NPM_TOKEN" ]; then
            echo "GITEA_NPM_TOKEN not set; installing without private billing packages"
          fi
          if [ -n "$GITEA_NPM_TOKEN" ]; then
            printf '\n//git.talesofai.com/api/packages/talesofai/npm/:_authToken=%s\n' "$GITEA_NPM_TOKEN" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency closure
        run: pnpm --filter @cohub/worker... build

      - name: Lint
        run: pnpm --filter @cohub/worker lint

      - name: Typecheck
        run: pnpm --filter @cohub/worker typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/worker/Dockerfile
          cache-from: type=gha,scope=worker-build
          cache-to: type=gha,mode=max,scope=worker-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          secrets: |
            gitea_npm_token=${{ secrets.GITEA_NPM_TOKEN }}

  deploy-dev:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_version }}
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Deploy to Dev
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kubectl set image deployment/cohub-user-worker-dev user-worker=$IMAGE -n cohub-dev
          kubectl set image deployment/cohub-system-worker-dev system-worker=$IMAGE -n cohub-dev

      - name: Verify deployment
        run: |
          status=0

          kubectl rollout status deployment/cohub-user-worker-dev -n cohub-dev --timeout=300s &
          user_worker_pid=$!

          kubectl rollout status deployment/cohub-system-worker-dev -n cohub-dev --timeout=300s &
          system_worker_pid=$!

          wait "$user_worker_pid" || status=1
          wait "$system_worker_pid" || status=1
          exit "$status"

  deploy-prod:
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Get tag
        id: get-tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Prod
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG
          kubectl set image deployment/cohub-user-worker user-worker=$IMAGE -n cohub
          kubectl set image deployment/cohub-system-worker system-worker=$IMAGE -n cohub

      - name: Verify deployment
        run: |
          status=0

          kubectl rollout status deployment/cohub-user-worker -n cohub --timeout=300s &
          user_worker_pid=$!

          kubectl rollout status deployment/cohub-system-worker -n cohub --timeout=300s &
          system_worker_pid=$!

          wait "$user_worker_pid" || status=1
          wait "$system_worker_pid" || status=1
          exit "$status"

  # Manual deploy for dev/prod
  deploy-manual-dev:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_version }}
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Deploy to Dev
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kubectl set image deployment/cohub-user-worker-dev user-worker=$IMAGE -n cohub-dev
          kubectl set image deployment/cohub-system-worker-dev system-worker=$IMAGE -n cohub-dev

      - name: Verify deployment
        run: |
          status=0

          kubectl rollout status deployment/cohub-user-worker-dev -n cohub-dev --timeout=300s &
          user_worker_pid=$!

          kubectl rollout status deployment/cohub-system-worker-dev -n cohub-dev --timeout=300s &
          system_worker_pid=$!

          wait "$user_worker_pid" || status=1
          wait "$system_worker_pid" || status=1
          exit "$status"

  deploy-manual-prod:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_version }}
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Deploy to Prod
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kubectl set image deployment/cohub-user-worker user-worker=$IMAGE -n cohub
          kubectl set image deployment/cohub-system-worker system-worker=$IMAGE -n cohub

      - name: Verify deployment
        run: |
          status=0

          kubectl rollout status deployment/cohub-user-worker -n cohub --timeout=300s &
          user_worker_pid=$!

          kubectl rollout status deployment/cohub-system-worker -n cohub --timeout=300s &
          system_worker_pid=$!

          wait "$user_worker_pid" || status=1
          wait "$system_worker_pid" || status=1
          exit "$status"
