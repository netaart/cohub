name: Node for Android

# Builds the Node that scripts/stage-runtime.mjs pins for Android, once per version, and publishes
# it to the CDN where the APK build fetches it.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/stage-runtime.mjs'
      - '.github/workflows/node-android.yml'
  workflow_dispatch:

concurrency:
  group: node-android
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: node
        run: |
          set -euo pipefail
          version="$(sed -n 's/^const NODE_VERSION = "\(.*\)";$/\1/p' scripts/stage-runtime.mjs)"
          name="node-v${version}-android-arm64.gz"
          published=false
          # The checksum goes up last, so it marks a complete publish.
          if curl -fsI "https://public.cohub.live/node/v${version}/${name}.sha256" > /dev/null; then published=true; fi
          {
            echo "version=$version"
            echo "name=$name"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

      - name: Install NDK
        id: ndk
        if: steps.node.outputs.published == 'false'
        run: |
          set -euo pipefail
          ndk="$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' apps/android/app/build.gradle.kts)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          echo "version=$ndk" >> "$GITHUB_OUTPUT"
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache > /dev/null

      # A rerun or the next version recompiles only what changed; saved even when the build fails.
      - name: Restore compiler cache
        if: steps.node.outputs.published == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: node-android-ndk${{ steps.ndk.outputs.version }}-${{ steps.node.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            node-android-ndk${{ steps.ndk.outputs.version }}-${{ steps.node.outputs.version }}-
            node-android-ndk${{ steps.ndk.outputs.version }}-

      - name: Build
        if: steps.node.outputs.published == 'false'
        env:
          VERSION: ${{ steps.node.outputs.version }}
          NAME: ${{ steps.node.outputs.name }}
        run: |
          set -euo pipefail
          source="node-v${VERSION}"
          curl -fsSLO "https://nodejs.org/dist/v${VERSION}/${source}.tar.xz"
          curl -fsSL "https://nodejs.org/dist/v${VERSION}/SHASUMS256.txt" | grep "  ${source}.tar.xz$" | sha256sum -c -
          tar -xJf "${source}.tar.xz"
          cd "$source"
          ./android-configure patch
          # zlib reaches for the NDK's deprecated cpufeatures on Android; getauxval, its Linux path, works there too.
          sed -i "s/'ARMV8_OS_ANDROID'/'ARMV8_OS_LINUX'/" deps/zlib/zlib.gyp
          # What android-configure sets, plus: API 30, as the device Runtime needs Android 11; V8's build
          # tools built for this host, where they run; no Temporal, whose Rust crates Node builds for one
          # target only, and the CLI does not use.
          toolchain="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$PATH:$toolchain" CC="$toolchain/aarch64-linux-android30-clang" CXX="$toolchain/aarch64-linux-android30-clang++" CC_host=gcc CXX_host=g++
          export GYP_DEFINES="target_arch=arm64 v8_target_arch=arm64 android_target_arch=arm64 host_os=linux OS=android android_ndk_path=$NDK"
          ./configure --dest-cpu=arm64 --dest-os=android --openssl-no-asm --cross-compiling --v8-disable-temporal-support
          export CCACHE_DIR=~/.cache/ccache CCACHE_BASEDIR="$PWD" CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=3G
          make -j"$(nproc)" CC.target="ccache $CC" CXX.target="ccache $CXX" CC.host="ccache gcc" CXX.host="ccache g++"
          ccache --show-stats
          mkdir -p ../dist
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -o ../dist/node out/Release/node
          cp LICENSE ../dist/LICENSE
          cd ../dist
          gzip -n node
          mv node.gz "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

      - name: Save compiler cache
        if: always() && steps.node.outputs.published == 'false'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: node-android-ndk${{ steps.ndk.outputs.version }}-${{ steps.node.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish
        if: steps.node.outputs.published == 'false'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PUBLIC_ASSET_OSS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PUBLIC_ASSET_OSS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-1
          VERSION: ${{ steps.node.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.aws
          printf '[default]\nrequest_checksum_calculation = when_required\nresponse_checksum_validation = when_required\ns3 =\n    addressing_style = virtual\n' > ~/.aws/config
          upload() { aws s3 cp "$@" --endpoint-url https://oss-us-west-1.aliyuncs.com --cache-control 'public, max-age=31536000, immutable'; }
          upload dist "s3://cohub-public/node/v${VERSION}/" --recursive --exclude '*.sha256'
          upload dist "s3://cohub-public/node/v${VERSION}/" --recursive --exclude '*' --include '*.sha256'
