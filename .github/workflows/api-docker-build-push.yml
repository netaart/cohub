name: API Docker Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/api-docker-build-push.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment for migration'
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: git.talesofai.com
  NAMESPACE: ${{ secrets.GITEA_OWNER }}
  IMAGE_NAME: cohub-api

jobs:
  build-and-push:
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      GITEA_NPM_TOKEN: ${{ secrets.GITEA_NPM_TOKEN }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate service tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid production service tag: $TAG"
            echo "Expected a stable semver tag like v1.23.0."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Configure Talesofai npm auth
        run: |
          if [ -z "$GITEA_NPM_TOKEN" ]; then
            echo "GITEA_NPM_TOKEN not set; installing without private billing packages"
          fi
          if [ -n "$GITEA_NPM_TOKEN" ]; then
            printf '\n//git.talesofai.com/api/packages/talesofai/npm/:_authToken=%s\n' "$GITEA_NPM_TOKEN" >> ~/.npmrc
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency closure
        run: pnpm --filter @cohub/api... build

      - name: Lint
        run: pnpm --filter @cohub/api lint

      - name: Typecheck
        run: pnpm --filter @cohub/api typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-{{sha}}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          cache-from: type=gha,scope=api-build
          cache-to: type=gha,mode=max,scope=api-build
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          secrets: |
            gitea_npm_token=${{ secrets.GITEA_NPM_TOKEN }}

  deploy-dev:
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Run migration if needed
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD~1"
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            'apps/api/src/db/schema-v2.ts' \
            'apps/api/drizzle/v2/*.sql' \
            'apps/api/drizzle/v2/meta/_journal.json' 2>/dev/null || true)

          if [ -z "$CHANGED" ]; then
            echo "No migration needed"
            exit 0
          fi

          echo "Migration-related changes detected:"
          echo "$CHANGED"

          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "Migration needed, running with image: $IMAGE"

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub-dev
          spec:
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-dev-secrets
                            key: DATABASE_URL
          EOF

          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub-dev --timeout=660s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub-dev || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub-dev --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub-dev -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi

      - name: Deploy to Dev
        run: |
          kubectl set image deployment/cohub-api-dev cohub-api-dev=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n cohub-dev
          kubectl set image deployment/cohub-fs-api-dev cohub-fs-api-dev=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n cohub-dev

      - name: Verify deployment
        run: |
          status=0

          kubectl rollout status deployment/cohub-api-dev -n cohub-dev --timeout=300s &
          api_pid=$!

          kubectl rollout status deployment/cohub-fs-api-dev -n cohub-dev --timeout=300s &
          fs_api_pid=$!

          wait "$api_pid" || status=1
          wait "$fs_api_pid" || status=1
          exit "$status"

  deploy-prod:
    needs: build-and-push
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Get tag
        id: get-tag
        run: |
          TAG="${{ github.ref_name }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Run migration
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          echo "Running migration with image: $IMAGE"
          
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub
          spec:
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-secrets
                            key: DATABASE_URL
          EOF
          
          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub --timeout=660s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi

      - name: Deploy to Prod
        run: |
          TAG="${{ steps.get-tag.outputs.tag }}"
          kubectl set image deployment/cohub-api cohub-api=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG -n cohub
          kubectl set image deployment/cohub-fs-api cohub-fs-api=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:$TAG -n cohub

      - name: Verify deployment
        run: |
          status=0

          kubectl rollout status deployment/cohub-api -n cohub --timeout=300s &
          api_pid=$!

          kubectl rollout status deployment/cohub-fs-api -n cohub --timeout=300s &
          fs_api_pid=$!

          wait "$api_pid" || status=1
          wait "$fs_api_pid" || status=1
          exit "$status"

  # Manual migration trigger for dev/prod
  migrate-dev:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' }}
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Run migration
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          echo "Running migration with image: $IMAGE"

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub-dev
          spec:
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-dev-secrets
                            key: DATABASE_URL
          EOF

          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub-dev --timeout=660s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub-dev || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub-dev --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub-dev -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi

  migrate-prod:
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Run migration
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}
          echo "Running migration with image: $IMAGE"

          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: api-migrate-${{ github.run_id }}
            namespace: cohub
          spec:
            activeDeadlineSeconds: 600
            ttlSecondsAfterFinished: 3600
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${IMAGE}
                    imagePullPolicy: Always
                    command: ["node", "dist/db/migrate.js"]
                    env:
                      - name: DATABASE_URL
                        valueFrom:
                          secretKeyRef:
                            name: cohub-api-secrets
                            key: DATABASE_URL
          EOF

          if kubectl wait --for=condition=complete job/api-migrate-${{ github.run_id }} \
            -n cohub --timeout=660s; then
            echo "Migration completed successfully"
          else
            echo "Migration job failed or timed out, showing diagnostics:"
            echo "--- Pod Events ---"
            kubectl describe job api-migrate-${{ github.run_id }} -n cohub || true
            echo "--- Pod Logs ---"
            kubectl logs job/api-migrate-${{ github.run_id }} -n cohub --tail=50 || true
            echo "--- Pod Status ---"
            kubectl get pods -n cohub -l job-name=api-migrate-${{ github.run_id }} || true
            exit 1
          fi
