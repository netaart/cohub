name: iOS

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/desktop/macos/Sources/CohubCore/**'
      - 'apps/desktop/macos/Sources/CohubAppleAuth/**'
      - 'packages/protocol/host-bridge.json'
      - '.github/workflows/ios.yml'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/ios/**'
      - 'apps/desktop/macos/Sources/CohubCore/**'
      - 'apps/desktop/macos/Sources/CohubAppleAuth/**'
      - 'packages/protocol/host-bridge.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer

jobs:
  build:
    name: Build (${{ matrix.scheme }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Cohub
            configuration: Debug
          - scheme: Cohub Dev
            configuration: Debug Dev
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Build for the simulator
        uses: apple-actions/xcodebuild@v1.3.0
        with:
          project: apps/ios/Cohub.xcodeproj
          scheme: ${{ matrix.scheme }}
          configuration: ${{ matrix.configuration }}
          destination: generic/platform=iOS Simulator
          build-settings: CODE_SIGNING_ALLOWED=NO
      - name: Check older OS runtime compatibility
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          otool -L ".build/DerivedData/Build/Products/$CONFIGURATION-iphonesimulator/Cohub.app/Cohub" > "$RUNNER_TEMP/ios-libraries.txt"
          if grep -q 'libswiftWebKit' "$RUNNER_TEMP/ios-libraries.txt"; then
            echo '::error::The Swift WebKit overlay is unavailable on supported older OS versions.'
            exit 1
          fi
