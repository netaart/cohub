name: iOS

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'apps/desktop/macos/Sources/CohubCore/**'
      - 'apps/desktop/macos/Sources/CohubAppleAuth/**'
      - 'packages/protocol/host-bridge.json'
      - '.github/workflows/ios.yml'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/ios/**'
      - 'apps/desktop/macos/Sources/CohubCore/**'
      - 'apps/desktop/macos/Sources/CohubAppleAuth/**'
      - 'packages/protocol/host-bridge.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Build both environments for the simulator
        run: |
          set -euo pipefail
          for scheme in Cohub "Cohub Dev"; do
            xcodebuild -project apps/ios/Cohub.xcodeproj -scheme "$scheme" -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO -quiet build
          done
