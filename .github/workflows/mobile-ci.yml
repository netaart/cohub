name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

defaults:
  run:
    working-directory: apps/mobile

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-pr-title.mjs "$PR_TITLE"

      - name: Run quality checks
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Runs alongside Quality: the export does not read lint/typecheck results, and
  # serializing the two added ~70s to every pull request and main push.
  bundle:
    name: Bundle (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Export ${{ matrix.platform }} bundle
        run: npx expo export --platform "${{ matrix.platform }}" --output-dir "dist/${{ matrix.platform }}"

      - name: Upload ${{ matrix.platform }} bundle
        uses: actions/upload-artifact@v7
        with:
          name: cohub-mobile-${{ matrix.platform }}-${{ github.sha }}
          path: apps/mobile/dist/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
