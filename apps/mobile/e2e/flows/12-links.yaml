appId: io.github.markbang.cohubmobile
name: Message link resolution
---
# Deep links and notification payloads are untrusted routing input, so the resolver is part of
# the security surface. The presets at the bottom feed known URL families.
- openLink: "cohub://debug/links"
- extendedWaitUntil:
    visible: "解析结果"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "web 会话"
    direction: DOWN
- tapOn: "web 会话"
# The result is one pretty-printed JSON node, so the match spans newlines and pins the field.
- scrollUntilVisible:
    element:
      text: '[\s\S]*"kind": "session"[\s\S]*'
    direction: UP
- assertVisible: '[\s\S]*"kind": "session"[\s\S]*'
- scrollUntilVisible:
    element:
      text: "web 空间"
    direction: DOWN
- tapOn: "web 空间"
- scrollUntilVisible:
    element:
      text: '[\s\S]*"kind": "space"[\s\S]*'
    direction: UP
- assertVisible: '[\s\S]*"kind": "space"[\s\S]*'
- scrollUntilVisible:
    element:
      text: "沙箱文件"
    direction: DOWN
- tapOn: "沙箱文件"
- scrollUntilVisible:
    element:
      text: '[\s\S]*"kind": "file"[\s\S]*'
    direction: UP
- assertVisible: '[\s\S]*"kind": "file"[\s\S]*'
- scrollUntilVisible:
    element:
      text: "外部链接"
    direction: DOWN
- tapOn: "外部链接"
- scrollUntilVisible:
    element:
      text: '[\s\S]*"kind": "external"[\s\S]*'
    direction: UP
- assertVisible: '[\s\S]*"kind": "external"[\s\S]*'
- scrollUntilVisible:
    element:
      text: "非法"
    direction: DOWN
- tapOn: "非法"
- scrollUntilVisible:
    element:
      text: ".*无效或不受支持的 scheme.*"
    direction: UP
- assertVisible: ".*无效或不受支持的 scheme.*"
