appId: io.github.markbang.cohubmobile
name: Debug menu entry
---
# Each other flow deep-links straight to its screen, so this covers the hidden entry instead:
# five taps on the version row at the bottom of Settings, which needs scrolling into view.
- openLink: "cohub://settings"
- scrollUntilVisible:
    element:
      id: "settings.version"
    direction: DOWN
- repeat:
    times: 5
    commands:
      - tapOn:
          id: "settings.version"
- assertVisible: "Scroll Diagnostics"
- assertVisible: "Bubble Layout"
