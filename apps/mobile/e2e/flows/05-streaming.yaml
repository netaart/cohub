appId: io.github.markbang.cohubmobile
name: Streaming render harness
---
- openLink: "cohub://debug/streaming"
# The status chip doubles as the "the screen is up" check: the metrics line sits in a bottom
# bar that a narrow emulator clips.
- extendedWaitUntil:
    visible: "^暂停$"
    timeout: 15000
- tapOn: "^暂停$"
- assertVisible: "^继续$"
# Long body plus tool blocks is the expensive render path.
- tapOn: "^长文$"
- assertVisible: "^短文$"
- tapOn: "^工具$"
- assertVisible: "^无工具$"
- tapOn: "^继续$"
- assertVisible: "^暂停$"
