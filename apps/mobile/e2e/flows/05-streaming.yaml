appId: io.github.markbang.cohubmobile
name: Streaming render harness
---
- openLink: "cohub://debug/streaming"
- assertVisible:
    id: "debug.streaming.metrics"
# The harness starts streaming on mount, so the counter must advance past zero.
- assertVisible: "已输出 [1-9][0-9]* / [0-9]+ 字"
- tapOn: "^暂停$"
- assertVisible: "^继续$"
# Long body plus tool blocks is the expensive render path.
- tapOn: "^长文$"
- assertVisible: "^短文$"
- tapOn: "^工具$"
- assertVisible: "^无工具$"
- tapOn: "^继续$"
- assertVisible: "^暂停$"
- assertVisible:
    id: "debug.streaming.metrics"
