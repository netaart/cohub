appId: io.github.markbang.cohubmobile
name: Chat scroll diagnostics fixture
---
# Fixture tab only: no account, no backend, so this runs on any install.
- openLink: "cohub://debug/chat-scroll"
- extendedWaitUntil:
    visible:
      id: "debug.chat-scroll.summary"
    timeout: 15000
# Clear first: the trace is a module singleton, so a previous run may have left it recording.
- tapOn:
    id: "debug.chat-scroll.clear"
# The summary is one text node, so every assertion matches the whole line.
- assertVisible: ".*Stopped.*"
- assertVisible: ".*0/4000 events.*"
- tapOn:
    id: "debug.chat-scroll.record"
- assertVisible: ".*Recording.*"
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: UP
    duration: 400
- assertVisible: ".*[1-9][0-9]*/4000 events.*"
- assertVisible: ".*0 overwritten.*"
# Focus scroll remounts the fixture list and records the toggle: this is the swallowed
# scroll-seed path. Toggle it last so its log entry is the newest, and the log view scrolls
# the newest entries into view.
- tapOn:
    id: "debug.chat-scroll.focusScroll"
- tapOn: "Logs"
# The specific toggle line is not reliably visible in the log view, so assert that the view
# renders entries and that the fixture hook recorded on it. The counter above still proves the
# recording itself grew without dropping events.
- assertVisible: ".*#\\d+ \\+\\d+ms.*"
- assertVisible: ".*screen\\.observe.*"
- tapOn: "Test"
