appId: io.github.markbang.cohubmobile
name: i18n coverage
---
- openLink: "cohub://debug/i18n"
- extendedWaitUntil:
    visible:
      id: "debug.i18n.keys"
    timeout: 15000
# A missing zh key is a regression, so the count is pinned rather than just displayed.
- assertVisible: ".*缺失 0.*"
# Exercise the switch. The preference row cannot be read back: copyTextFrom resolves the testID
# to the whole row and returns its label, so only the rendered text is asserted.
- tapOn: "^zh$"
- tapOn: "^en$"
- tapOn: "^system$"
- assertVisible: ".*缺失 0.*"
