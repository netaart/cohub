appId: io.github.markbang.cohubmobile
name: Sign in on the dev tenant
---
# Every route, including app/debug, renders AuthScreen until a Logto session exists, so this
# runs before the debug flows. The production tenant signs in with an email code only; the dev
# tenant enables password sign-in, and the login screen can switch environments.
- launchApp:
    clearState: false
- tapOn: "Development"
- tapOn: "Continue with Cohub"
# Logto's hosted page opens in a Custom Tab, outside the app under test. A fresh emulator
# shows Chrome's first-run screen first, which blocks the page until it is dismissed.
- extendedWaitUntil:
    visible: "(Welcome to Chrome|Accept & continue|Use without an account|Email|Sign in)"
    timeout: 60000
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn: "Use without an account"
- runFlow:
    when:
      visible: "Accept & continue"
    commands:
      - tapOn: "Accept & continue"
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn: "No thanks"
- extendedWaitUntil:
    visible: "Email"
    timeout: 45000
- tapOn: "Email"
- inputText: ${E2E_ACCOUNT_EMAIL}
# The tenant requires the terms consent before it accepts the identifier.
- tapOn: "I have read and agree to the Terms of Use and Privacy Policy"
# "Sign in" is also the page title, so anchor to the button alone.
- tapOn: "^(Sign in|Continue)$"
# The password step only appears after the identifier is submitted.
- extendedWaitUntil:
    visible: "Password"
    timeout: 45000
- tapOn: "Password"
- inputText: ${E2E_ACCOUNT_PASSWORD}
# The on-screen keyboard covers the submit button, so dismiss it before tapping.
- hideKeyboard
- extendedWaitUntil:
    visible: "^(Sign in|Continue)$"
    timeout: 20000
- tapOn: "^(Sign in|Continue)$"
# The redirect returns to the app, which then renders the authenticated tab tree.
- extendedWaitUntil:
    visible: "Chats"
    timeout: 90000
