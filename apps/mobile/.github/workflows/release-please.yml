name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  mobile-release:
    name: Build Android APK
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.NATIVE_AUTO_RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/native-release.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
      platform: android
      profile: preview
      submit: false
      release_tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit

  publish-android:
    name: Publish standalone Android APKs to GitHub Release
    needs: [release, mobile-release]
    if: needs.release.outputs.release_created == 'true' && vars.NATIVE_AUTO_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download standalone Android APKs
        uses: actions/download-artifact@v8
        with:
          name: cohub-android-preview-${{ github.run_id }}
          path: build/release

      - name: Upload standalone APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/release/*.apk)
          test "${#apks[@]}" -eq 4 || { echo "Expected four Android ABI APKs, found ${#apks[@]}"; exit 1; }
          for apk in "${apks[@]}"; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            case "$abi" in
              armeabi-v7a|arm64-v8a|x86|x86_64) ;;
              *) echo "Unexpected Android APK name: $(basename "$apk")"; exit 1 ;;
            esac
            release_apk="cohub-${RELEASE_TAG}-android-${abi}.apk"
            cp "$apk" "$release_apk"
            gh release upload "$RELEASE_TAG" "$release_apk" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          done

  native-release-not-configured:
    name: Native release is disabled
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.NATIVE_AUTO_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain release gate
        run: |
          echo "::notice::GitHub Release created without an Android APK."
          echo "Set the NATIVE_AUTO_RELEASE_ENABLED repository variable to true to build and attach an Android APK."
