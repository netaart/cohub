name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  mobile-release:
    name: Build native mobile release
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.NATIVE_AUTO_RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/native-release.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}
      platform: all
      profile: production
      submit: ${{ vars.NATIVE_AUTO_SUBMIT_ENABLED == 'true' }}
      android_track: internal
      release_tag: ${{ needs.release.outputs.tag_name }}
    secrets: inherit

  native-release-not-configured:
    name: Native release is disabled
    needs: release
    if: needs.release.outputs.release_created == 'true' && vars.NATIVE_AUTO_RELEASE_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Explain release gate
        run: |
          echo "::notice::GitHub Release created without native store artifacts."
          echo "Set the NATIVE_AUTO_RELEASE_ENABLED repository variable to true after configuring signing credentials."
