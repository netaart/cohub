name: EAS Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
      platform:
        description: Platform to build
        required: false
        type: string
        default: all
      profile:
        description: EAS build profile
        required: false
        type: string
        default: production
      submit:
        description: Submit completed builds to the stores
        required: false
        type: boolean
        default: false
      release_tag:
        description: Release tag expected to match the app version
        required: false
        type: string
        default: ""
    secrets:
      EXPO_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to current ref)
        required: false
        type: string
      platform:
        description: Platform to build
        required: true
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: EAS build profile
        required: true
        type: choice
        options: [development, preview, production]
        default: preview
      submit:
        description: Submit completed builds to the stores
        required: true
        type: boolean
        default: false
      release_tag:
        description: Optional release tag to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: eas-${{ inputs.profile || 'production' }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
  EXPO_OWNER: ${{ vars.EXPO_OWNER }}
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    name: ${{ inputs.profile || 'production' }} (${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source and release configuration
        run: |
          npm run check
          npm run release:check -- --require-eas

      - name: Verify Expo account
        run: npx eas-cli@22.6.0 whoami --non-interactive

      - name: Queue EAS build
        id: eas
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          PROFILE: ${{ inputs.profile || 'production' }}
          AUTO_SUBMIT: ${{ inputs.submit }}
        run: |
          args=(build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait --json)
          if [[ "$AUTO_SUBMIT" == "true" ]]; then
            args+=(--auto-submit)
          fi
          npx eas-cli@22.6.0 "${args[@]}" > eas-builds.json
          node scripts/summarize-eas-build.mjs eas-builds.json

      - name: Upload EAS build metadata
        if: always() && hashFiles('eas-builds.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: eas-builds-${{ inputs.profile || 'production' }}-${{ github.run_id }}
          path: eas-builds.json
          retention-days: 30
