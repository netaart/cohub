name: Publish Yaota APKs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: vX.Y.Z tag whose GitHub Release APKs should be copied to Yaota
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-yaota-apks-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Copy release APKs to Yaota
    if: github.repository == 'markbang/cohub-mobile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download GitHub Release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vX.Y.Z tag, received: $RELEASE_TAG"
            exit 1
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "cohub-${RELEASE_TAG}-android-*.apk"
          mapfile -t files < <(find . -maxdepth 1 -type f -name "cohub-${RELEASE_TAG}-android-*.apk" | sort)
          test "${#files[@]}" -eq 4 || { echo "Expected four ABI APKs on $RELEASE_TAG, found ${#files[@]}"; exit 1; }

      - name: Upload APKs to Yaota
        env:
          OTA_SERVER: ${{ vars.OTA_SERVER }}
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$OTA_SERVER" || { echo "OTA_SERVER is required to publish APKs to Yaota."; exit 1; }
          test -n "$OTA_API_KEY" || { echo "OTA_API_KEY is required to publish APKs to Yaota."; exit 1; }
          mapfile -t files < <(find . -maxdepth 1 -type f -name "cohub-${RELEASE_TAG}-android-*.apk" | sort)
          node --experimental-strip-types scripts/publish-yaota-apks.mjs "${files[@]}"
