name: Native CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npm run native:android:prepare

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-java hashes the prebuild-generated android/*.gradle files into its cache key
      # and never falls back to an older entry, so every app version or config bump starts
      # cold (~4 minutes of re-downloaded dependencies and artifact transforms). The Gradle
      # caches only depend on the committed dependency set, which changes far less often.
      - name: Restore Gradle caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compile debug APKs
        env:
          COHUB_ANDROID_ARCHITECTURES: armeabi-v7a,arm64-v8a,x86,x86_64
        run: npm run native:android:build

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: cohub-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-*-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS project and install pods
        run: npm run native:ios:prepare

      - name: Compile simulator app
        run: npm run native:ios:build

      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: cohub-ios-simulator-${{ github.sha }}
          path: build/artifacts/Cohub-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
