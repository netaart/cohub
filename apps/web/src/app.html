<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      interactive-widget=resizes-content: Android Chrome shrinks the layout
      viewport when the soft keyboard opens instead of panning the visual
      viewport. Panning can leave the shell offset after the keyboard closes,
      exposing the root canvas below the composer. iOS ignores this key.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Cohub</title>
    <meta name="application-name" content="Cohub" />
    <meta name="apple-mobile-web-app-title" content="Cohub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <!-- Favicons are set per-route (Work pages use Work icons; others use shell defaults). -->
    <script>
      (() => {
        var segments = location.pathname.split('/').filter(Boolean);
        var isPublicWorkUrl = segments.length === 4 && segments[2] === 'w';
        var href = isPublicWorkUrl
          ? `/app.webmanifest?start_url=${encodeURIComponent(location.pathname)}`
          : '/manifest.webmanifest';
        document.write(`<link rel="manifest" href="${href}" />`);
      })();
    </script>
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Prevent FOUC — resolve theme before first paint
      (() => {
        function readStoredValue(key) {
          try {
            return localStorage.getItem(key);
          } catch (_error) {
            return null;
          }
        }
        function resolveUiLocale(preference, languages) {
          var languageIndex;
          var primaryLanguage;
          if (preference === 'en' || preference === 'zh-CN') return preference;
          for (languageIndex = 0; languageIndex < languages.length; languageIndex++) {
            primaryLanguage = (languages[languageIndex] || '').split('-')[0].toLowerCase();
            if (primaryLanguage === 'en') return 'en';
            if (primaryLanguage === 'zh') return 'zh-CN';
          }
          return 'en';
        }

        // Resolve the UI language before paint. The reactive locale store takes
        // over after hydration and keeps this attribute in sync.
        var pathForLocale = location.pathname;
        function isPublicLangPath(path) {
          if (path === '/' || path === '') return true;
          if (path.indexOf('/docs') === 0 || path.indexOf('/pricing') === 0 || path.indexOf('/changelog') === 0 || path.indexOf('/trending') === 0) return true;
          if (path.indexOf('/invite') === 0 || path.indexOf('/referrals') === 0 || path.indexOf('/app-auth') === 0 || path === '/callback') return true;
          var seg = path.split('/').filter(Boolean);
          if (seg.length === 4 && (seg[2] === 'w' || seg[2] === 'join')) return true;
          if (seg[0] === 'zh') return true;
          return false;
        }
        var localePreference = readStoredValue('cohub-locale') || 'system';
        var pubSeg = pathForLocale.split('/').filter(Boolean);
        // Public pages derive lang from the URL (set by SSR); the app shell
        // uses the persisted / browser preference.
        var locale = isPublicLangPath(pathForLocale)
          ? (pubSeg[0] === 'zh' ? 'zh-CN' : 'en')
          : resolveUiLocale(localePreference, navigator.languages || [navigator.language]);
        document.documentElement.lang = locale;

        // Mirrors --bg-primary of each theme (theme-registry.ts) so browser
        // chrome and the root canvas share one color before hydration.
        var themeColors = {
          dark: '#101213',
          light: '#FFFFFF',
          'solarized-dark': '#011415',
          'solarized-light': '#FFFADE',
          'neta-studio': '#050605',
          'neta-pixel': '#FFFFFF',
          'neta-pixel-dark': '#0B0C0D'
        };
        var stored = readStoredValue('cohub-theme');
        var resolved;
        var path = location.pathname;
        // Marketing home renders light so product captures only need one theme;
        // other public pages follow the visitor theme.
        var isHome = path === '/' || path === '';
        if (isHome) {
          resolved = 'light';
        } else if (Object.hasOwn(themeColors, stored)) {
          resolved = stored;
        } else if (stored === 'system' || !stored) {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          resolved = 'dark';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          'content',
          themeColors[resolved]
        );

        // Home: if a session may exist, hide marketing before paint (SEO HTML still in DOM).
        var homeHint = false;
        var homeToken = '';
        var homeLogto = false;
        var logtoApps = ['vpikk7sl9zwvefiptowtn', '16ai0wao2mud3xqkbzqo0'];
        var i = 0;
        if (path === '/' || path === '') {
          try {
            homeHint = readStoredValue('cohub:session-hint') === '1';
            homeToken = (readStoredValue('cohub_token') || '').trim();
            // Official Logto app ids (dev + prod) — residue means a prior session.
            for (i = 0; i < logtoApps.length; i++) {
              if (
                readStoredValue(`logto:${logtoApps[i]}:refreshToken`) ||
                readStoredValue(`logto:${logtoApps[i]}:idToken`)
              ) {
                homeLogto = true;
                break;
              }
            }
            if (homeHint || homeToken || homeLogto) {
              document.documentElement.setAttribute('data-home-redirect', '1');
            }
          } catch (_error) {}
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
