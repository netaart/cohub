name = "cohub-web-dev"
main = "entry.worker.ts"
compatibility_date = "2025-03-05"
compatibility_flags = ["nodejs_compat"]

# Standalone App host routes are deployment-specific (a separate zone), so they
# are configured outside the repository; see deploy/web/README.md.

[assets]
directory = ".svelte-kit/cloudflare/assets"
binding = "ASSETS"
run_worker_first = true
