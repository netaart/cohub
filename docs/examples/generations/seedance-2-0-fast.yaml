schema: neta.generation.model.v1
model: seedance-2-0-fast
title: Seedance 2.0 Fast
category: video
description: Fast video generation model that accepts text, image, video, and audio inputs. Faster and less expensive than seedance-2-0, making it well suited to creative validation and draft iteration.
pricing:
  unit: 1m_tokens
  min: 3.3
  max: 5.6
  note: BytePlus list USD; varies by resolution and video input
adapter:
  type: ark.videoGenerations
content:
  input:
    - type: text
      required: true
      min: 1
      max: 16
      merge: newline
      description: Video prompt.
    - type: image
      required: false
      max: 9
      sources:
        - url
      roles:
        - first_frame
        - last_frame
        - reference_image
      description: Optional public URL image input. Use meta.role as first_frame, last_frame, or reference_image.
    - type: video
      required: false
      max: 1
      sources:
        - url
      roles:
        - reference_video
      roleRequired: true
      description: Optional public URL reference video input. Use meta.role as reference_video.
    - type: audio
      required: false
      max: 3
      sources:
        - url
      roles:
        - reference_audio
      roleRequired: true
      description: Optional public URL reference audio. Use meta.role reference_audio. Audio cannot be the only media input; include at least one image or video. Do not mix first_frame/last_frame with reference_audio.
parameters:
  duration:
    type: integer
    optional: true
    default: 5
    min: 4
    max: 15
    description: Video duration in seconds.
  resolution:
    type: string
    optional: true
    default: 720p
    enum: [480p, 720p]
    description: Output video resolution.
  ratio:
    type: string
    optional: true
    default: "16:9"
    enum: ["16:9", "9:16", "1:1", "4:3", "3:2", "2:3", "3:4", "21:9", adaptive]
    description: Output aspect ratio. Use adaptive to let the model choose.
  seed:
    type: integer
    optional: true
    description: Random seed for reproducibility.
  camera_fixed:
    type: boolean
    optional: true
    default: false
    description: Fix camera position when supported.
  poll_interval:
    type: integer
    optional: true
    default: 1
    min: 1
    max: 30
    description: Seconds between task status checks.
  max_wait:
    type: integer
    optional: true
    default: 600
    min: 30
    max: 1800
    description: Maximum seconds to wait for task completion.
examples:
  - title: Text to video
    request:
      model: seedance-2-0-fast
      content:
        - type: text
          text: a cat playing piano in a cozy jazz club, cinematic lighting, smooth camera movement
      parameters:
        duration: 5
        resolution: 720p
        ratio: "16:9"
  - title: Image and reference audio
    request:
      model: seedance-2-0-fast
      content:
        - type: text
          text: Close-up of the same person speaking. Lip-sync mouth motion to the reference audio.
        - type: image
          source:
            type: url
            url: https://example.com/portrait.png
          meta:
            role: reference_image
        - type: audio
          source:
            type: url
            url: https://example.com/speech.mp3
          meta:
            role: reference_audio
      parameters:
        duration: 8
        resolution: 720p
        ratio: "9:16"
